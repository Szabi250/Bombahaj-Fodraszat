<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bombahaj Fodrászat – Időpontfoglalás">

  <link rel="stylesheet" href="style.css">
  <title>Bombahaj Fodrászat</title>
</head>

<body>

<header class="hero">
  <img src="Fodrász.png" class="logo" alt="logó">

  <h1>Bombahaj Fodrászat</h1>
  <p>Stílus. Minőség. Magabiztosság.</p>

  <div id="status" class="status green">🟢 Most lehet foglalni!</div>
</header>

<section class="contact">
  <h2>Üdvözöllek!</h2>
  <p>Minőségi hajvágás és festés.</p>
</section>

<section class="hours">
  <h3>Nyitvatartás</h3>
  <p>Előzetes időpontfoglalás szükséges.</p>
</section>

<section class="contact">
  <h3>Kapcsolat</h3>
  <p>📍 Kaposvár</p>
  <p>📞 06 20 / 431-5206</p>
</section>

<section class="gallery">
  <h2>Galéria</h2>
  <div class="gallery-grid">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
    <img src="4.jpg">
  </div>
</section>

<!-- FOGLALÁS -->
<section id="booking" class="pop">
  <h2>Időpont foglalás</h2>

  <label>Szolgáltatás:</label>
  <select id="service">
    <option value="30">Férfi vágás (30p)</option>
    <option value="60">Női vágás (60p)</option>
    <option value="90">Mosás + vágás (90p)</option>
    <option value="120">Melír (120p)</option>
    <option value="180">Festés (180p)</option>
  </select>

  <br><br>

  <label>Dátum:</label>
  <input type="date" id="date">

  <br><br>

  <div id="times"></div>

  <br>

  <button onclick="book()">Foglalás</button>
</section>

<!-- ADMIN -->
<section id="adminPanel" class="pop">
  <h2>Admin panel</h2>

  <label><input type="checkbox" value="1"> Hétfő</label><br>
  <label><input type="checkbox" value="2"> Kedd</label><br>
  <label><input type="checkbox" value="3"> Szerda</label><br>
  <label><input type="checkbox" value="4"> Csütörtök</label><br>
  <label><input type="checkbox" value="5"> Péntek</label><br>
  <label><input type="checkbox" value="6"> Szombat</label><br>
  <label><input type="checkbox" value="0"> Vasárnap</label><br>

  <br>
  <label>Nyitás: <input type="time" id="openTime"></label>
  <label>Zárás: <input type="time" id="closeTime"></label>

  <br><br>
  <button onclick="saveAdmin()">Mentés</button>
</section>

<footer>
  © 2026 Bombahaj Fodrászat
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const status = document.getElementById("status");
  if (status.classList.contains("red")) return;

  const baseStart = 10;
  const baseEnd = 20;

  let bookings = JSON.parse(localStorage.getItem("bookings")) || {};
  let selected = null;

  const dateInput = document.getElementById("date");
  const serviceSelect = document.getElementById("service");
  const timesDiv = document.getElementById("times");

  dateInput.addEventListener("change", generate);
  serviceSelect.addEventListener("change", generate);

  function getDuration() {
    return parseInt(serviceSelect.value);
  }

  function generate() {
    const date = dateInput.value;
    if (!date) return;

    timesDiv.innerHTML = "";

    const duration = getDuration();
    const day = bookings[date] || [];

    for (let h = baseStart; h < baseEnd; h++) {
      for (let m = 0; m < 60; m += 15) {

        let start = h * 60 + m;
        let end = start + duration;

        if (end > baseEnd * 60) continue;

        let conflict = day.some(b =>
          start < b.end && end > b.start
        );

        let label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

        let btn = document.createElement("button");
        btn.textContent = label;

        if (conflict) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            selected = { date, start, end };
            alert("Kiválasztva: " + label);
          };
        }

        timesDiv.appendChild(btn);
      }
    }
  }

  window.book = function () {

    if (!selected) return alert("Válassz időpontot!");

    let d = selected.date;

    if (!bookings[d]) bookings[d] = [];

    bookings[d].push({
      start: selected.start,
      end: selected.end
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    alert("Foglalás mentve!");

    selected = null;
    generate();
  };

});

function saveAdmin() {
  let days = [];
  document.querySelectorAll("#adminPanel input[type=checkbox]").forEach(c => {
    if (c.checked) days.push(c.value);
  });

  localStorage.setItem("admin", JSON.stringify(days));
  alert("Mentve!");
}
</script>

</body>
</html>
