<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bombahaj Fodrászat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>Bombahaj Fodrászat</h1>
  <div id="status" class="status green">🟢 Foglalható</div>
</header>

<section class="gallery">
  <h2>Galéria</h2>
  <div class="gallery-grid">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
    <img src="4.jpg">
  </div>
</section>

<!-- FOGLALÁS -->
<section class="pop">
  <h2>Időpontfoglalás</h2>

  <label>Szolgáltatás:</label>
  <select id="service">
    <option value="30">Férfi vágás (30p)</option>
    <option value="60">Női vágás (60p)</option>
    <option value="90">Mosás + vágás (90p)</option>
    <option value="120">Melír (120p)</option>
    <option value="180">Festés (180p)</option>
  </select>

  <br><br>

  <label>Dátum:</label>
  <input type="date" id="date">

  <br><br>

  <div id="times"></div>

  <br>

  <button onclick="book()">Foglalás</button>
</section>

<!-- ADMIN -->
<section class="pop">
  <h2>Admin panel</h2>

  <p>Nyitvatartási napok:</p>

  <label><input type="checkbox" value="1"> Hétfő</label>
  <label><input type="checkbox" value="2"> Kedd</label>
  <label><input type="checkbox" value="3"> Szerda</label>
  <label><input type="checkbox" value="4"> Csütörtök</label>
  <label><input type="checkbox" value="5"> Péntek</label>
  <label><input type="checkbox" value="6"> Szombat</label>
  <label><input type="checkbox" value="0"> Vasárnap</label>

  <br><br>

  <button onclick="saveAdmin()">Mentés</button>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const dateInput = document.getElementById("date");
  const serviceSelect = document.getElementById("service");
  const timesDiv = document.getElementById("times");

  const baseStart = 10;
  const baseEnd = 20;

  let bookings = JSON.parse(localStorage.getItem("bookings")) || {};
  let admin = JSON.parse(localStorage.getItem("adminSettings")) || {};
  let selected = null;

  dateInput.addEventListener("change", generate);
  serviceSelect.addEventListener("change", generate);

  // 🔥 nap ellenőrzés
  function isAllowedDay(dateStr) {
    if (!admin.days) return true;

    let d = new Date(dateStr).getDay();
    return admin.days.includes(d);
  }

  function generate() {

    const date = dateInput.value;
    if (!date) return;

    timesDiv.innerHTML = "";

    if (!isAllowedDay(date)) {
      timesDiv.innerHTML = "❌ Ezen a napon nincs nyitva!";
      return;
    }

    const duration = parseInt(serviceSelect.value);
    const dayBookings = bookings[date] || [];

    for (let h = baseStart; h < baseEnd; h++) {
      for (let m = 0; m < 60; m += 15) {

        let start = h * 60 + m;
        let end = start + duration;

        if (end > baseEnd * 60) continue;

        // 🔥 ÜTKÖZÉS ELLENŐRZÉS (FIX)
        let conflict = dayBookings.some(b =>
          start < b.end && end > b.start
        );

        let label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

        let btn = document.createElement("button");
        btn.textContent = label;

        if (conflict) {
          btn.disabled = true;
          btn.style.opacity = "0.3";
        } else {
          btn.onclick = () => {
            selected = { date, start, end };
            alert("Kiválasztva: " + label);
          };
        }

        timesDiv.appendChild(btn);
      }
    }
  }

  window.book = function () {

    if (!selected) {
      alert("Válassz időpontot!");
      return;
    }

    let d = selected.date;

    if (!bookings[d]) bookings[d] = [];

    bookings[d].push({
      start: selected.start,
      end: selected.end
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    alert("Foglalás mentve!");

    selected = null;
    generate();
  };

});

/* =====================
   ADMIN MENTÉS
===================== */
function saveAdmin() {

  let days = [];
  document.querySelectorAll("input[type=checkbox]").forEach(c => {
    if (c.checked) days.push(parseInt(c.value));
  });

  localStorage.setItem("adminSettings", JSON.stringify({
    days: days
  }));

  alert("Admin mentve!");
}
</script>

</body>
</html>
