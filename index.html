<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bombahaj Fodrászat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <img src="Fodrász.png" class="logo" alt="logo">
  <h1>Bombahaj Fodrászat</h1>
  <p>Stílus. Minőség. Magabiztosság.</p>
  <div class="status green">🟢 Foglalható</div>
</header>

<section class="contact">
  <h2>Üdvözöllek!</h2>
  <p>Minőségi hajvágás, festés és stílus tanácsadás.</p>
</section>

<section class="hours">
  <h3>Nyitvatartás</h3>
  <p>Előzetes időpontfoglalással működik.</p>
</section>

<section class="contact">
  <h3>Kapcsolat</h3>
  <p>📍 Kaposvár</p>
  <p>📞 06 20 / 431-5206</p>
</section>

<section class="gallery">
  <h2>Galéria</h2>
  <div class="gallery-grid">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
    <img src="4.jpg">
  </div>
</section>

<!-- ================= FOGLALÁS ================= -->
<section class="pop">
  <h2>Időpontfoglalás</h2>

  <label>Szolgáltatás:</label>
  <select id="service">
    <option value="30">Férfi vágás (30p)</option>
    <option value="60">Női vágás (60p)</option>
    <option value="90">Mosás + vágás (90p)</option>
    <option value="120">Melír (120p)</option>
    <option value="180">Festés (180p)</option>
  </select>

  <br><br>

  <label>Dátum:</label>
  <input type="date" id="date">

  <br><br>

  <div id="times"></div>

  <br>
  <button onclick="book()">Foglalás</button>
</section>

<!-- ================= STABIL JS ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const dateInput = document.getElementById("date");
  const serviceSelect = document.getElementById("service");
  const timesDiv = document.getElementById("times");

  if (!dateInput || !serviceSelect || !timesDiv) return;

  const baseStart = 10;
  const baseEnd = 20;

  let selected = null;

  function generate() {

    const date = dateInput.value;
    if (!date) return;

    timesDiv.innerHTML = "";

    const duration = parseInt(serviceSelect.value);

    for (let h = baseStart; h < baseEnd; h++) {
      for (let m = 0; m < 60; m += 15) {

        let start = h * 60 + m;
        let end = start + duration;

        if (end > baseEnd * 60) continue;

        let label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

        let btn = document.createElement("button");
        btn.textContent = label;

        btn.onclick = () => {
          selected = { date, start, end, label };
          alert("Kiválasztva: " + label);
        };

        timesDiv.appendChild(btn);
      }
    }
  }

  dateInput.addEventListener("change", generate);
  serviceSelect.addEventListener("change", generate);

  window.getSelected = () => selected;

  window.book = function () {

    const sel = window.getSelected();

    if (!sel) {
      alert("Válassz időpontot!");
      return;
    }

    alert("Foglalás mentve (teszt verzió)");

    selected = null;
    timesDiv.innerHTML = "";
  };

});
</script>

</body>
</html>
