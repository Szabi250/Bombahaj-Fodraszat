<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bombahaj Fodrászat – Németh Mónika Kaposváron.">
  
  <link rel="icon" type="image/png" href="Bombahaj Fodrászat Logó.png">
  <link rel="stylesheet" href="style.css">

  <title>Bombahaj Fodrászat</title>
</head>

<body>

<header class="hero">
  <div class="hero-content">
    <img src="Fodrász.png" class="logo" alt="logó">

    <h1>Bombahaj Fodrászat</h1>
    <p>Stílus. Minőség. Magabiztosság.</p>

    <div id="status" class="status green">🟢 Most lehet foglalni!</div>
  </div>
</header>

<section class="contact">
  <h2>Üdvözöllek!</h2>
  <p>Minőségi hajvágás, festés és stílus tanácsadás.</p>
</section>

<section class="hours">
  <h3>Nyitvatartás</h3>
  <p>Előzetes időpontfoglalással működik.</p>
</section>

<section class="contact">
  <h3>Kapcsolat</h3>
  <p>📍 Kaposvár</p>
  <p>📞 06 20 / 431-5206</p>
</section>

<section class="gallery">
  <h2>Galéria</h2>
  <div class="gallery-grid">
    <img src="1.jpg">
    <img src="2.jpg">
  </div>
</section>




<section id="booking" class="pop">
  <h2>Időpont foglalás</h2>

  <label>Szolgáltatás:</label>
  <select id="service">
    <option value="30">Férfi hajvágás (30p)</option>
    <option value="60">Női hajvágás (60p)</option>
    <option value="90">Hajvágás + mosás (90p)</option>
    <option value="120">Melír (120p)</option>
    <option value="180">Festés (180p)</option>
  </select>

  <br><br>

  <label>Dátum:</label>
  <input type="date" id="date">

  <br><br>

  <label>Időpont:</label>
  <div id="times"></div>

  <br>

  <button onclick="book()">Foglalás</button>
</section>




<script>
document.addEventListener("DOMContentLoaded", () => {

  const statusElement = document.getElementById("status");
  const bookingSection = document.getElementById("booking");

  // ha zárva → nincs foglalás
  if (statusElement.classList.contains("red")) {
    bookingSection.style.display = "none";
    return;
  }

  const baseStart = 9;
  const baseEnd = 18;

  let bookings = JSON.parse(localStorage.getItem("bookings")) || {};
  let selected = null;

  const dateInput = document.getElementById("date");
  const serviceSelect = document.getElementById("service");
  const timesDiv = document.getElementById("times");

  // minimum dátum (ne lehessen múltba)
  const today = new Date().toISOString().split("T")[0];
  dateInput.min = today;

  dateInput.addEventListener("change", generateTimes);
  serviceSelect.addEventListener("change", generateTimes);

  function generateTimes() {
    const date = dateInput.value;

    // ❗ JAVÍTÁS: ha nincs dátum → ne számoljon
    if (!date) {
      timesDiv.innerHTML = "Válassz dátumot!";
      return;
    }

    timesDiv.innerHTML = "";

    const duration = parseInt(serviceSelect.value);
    const dayBookings = bookings[date] || [];

    for (let h = baseStart; h < baseEnd; h++) {
      for (let m = 0; m < 60; m += 15) {

        let start = h * 60 + m;
        let end = start + duration;

        if (end > baseEnd * 60) continue;

        let conflict = dayBookings.some(b =>
          start < b.end && end > b.start
        );

        const label = `${String(h).padStart(2,'0')}:${m === 0 ? '00' : m}`;

        const btn = document.createElement("button");
        btn.textContent = label;

        if (conflict) {
          btn.disabled = true;
          btn.style.opacity = "0.4";
        } else {
          btn.onclick = () => {
            selected = { start, end, date };
            alert("Kiválasztva: " + date + " " + label);
          };
        }

        timesDiv.appendChild(btn);
      }
    }
  }

  window.book = function () {

    // ❗ JAVÍTÁS: dátum + időpont kötelező
    if (!selected || !selected.date) {
      alert("Válassz dátumot és időpontot!");
      return;
    }

    if (!bookings[selected.date]) {
      bookings[selected.date] = [];
    }

    bookings[selected.date].push({
      start: selected.start,
      end: selected.end
    });

    localStorage.setItem("bookings", JSON.stringify(bookings));

    alert("Foglalás mentve!");

    selected = null;
    generateTimes();
  }

});
</script>



<script type="module">
  // Firebase kód ide
</script>
  
</body>
</html>
