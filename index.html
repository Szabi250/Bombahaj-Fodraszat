<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bombahaj Fodrászat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>Bombahaj Fodrászat</h1>
  <p>Stílus. Minőség. Magabiztosság.</p>
  <div class="status green">🟢 Foglalható</div>
</header>

<section class="pop">
  <h2>Időpontfoglalás</h2>

  <label>Szolgáltatás:</label>
  <select id="service">
    <option value="30">Férfi vágás (30p)</option>
    <option value="60">Női vágás (60p)</option>
    <option value="90">Mosás + vágás (90p)</option>
    <option value="120">Melír (120p)</option>
    <option value="180">Festés (180p)</option>
  </select>

  <br><br>

  <label>Dátum:</label>
  <input type="date" id="date">

  <br><br>

  <div id="times"></div>

  <br>
  <button onclick="book()">Foglalás</button>
</section>

<!-- ================= FOGLALÁS LOGIKA ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const dateInput = document.getElementById("date");
  const serviceSelect = document.getElementById("service");
  const timesDiv = document.getElementById("times");

  const baseStart = 10;
  const baseEnd = 20;

  let selected = null;

  dateInput.addEventListener("change", generate);
  serviceSelect.addEventListener("change", generate);

  window.getSelected = () => selected;

  async function generate() {

    const date = dateInput.value;
    if (!date) return;

    timesDiv.innerHTML = "Betöltés...";

    const duration = parseInt(serviceSelect.value);

    const bookings = await window.loadBookings();
    const dayBookings = bookings[date] || [];

    timesDiv.innerHTML = "";

    for (let h = baseStart; h < baseEnd; h++) {
      for (let m = 0; m < 60; m += 15) {

        let start = h * 60 + m;
        let end = start + duration;

        if (end > baseEnd * 60) continue;

        let conflict = dayBookings.some(b =>
          start < b.end && end > b.start
        );

        let label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

        let btn = document.createElement("button");
        btn.textContent = label;

        if (conflict) {
          btn.disabled = true;
          btn.style.opacity = "0.3";
        } else {
          btn.onclick = () => {
            selected = { date, start, end, label };
            alert("Kiválasztva: " + label);
          };
        }

        timesDiv.appendChild(btn);
      }
    }
  }

});
</script>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJ09dkyySZKpf_X6IA_TJbvdEJzM8-mb4",
  authDomain: "bombahaj-fodraszat.firebaseapp.com",
  projectId: "bombahaj-fodraszat",
  storageBucket: "bombahaj-fodraszat.firebasestorage.app",
  messagingSenderId: "90693281570",
  appId: "1:90693281570:web:9b17d1e00206baaf63277b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 BETÖLTÉS
window.loadBookings = async function () {

  const snapshot = await getDocs(collection(db, "bookings"));

  let data = {};

  snapshot.forEach(doc => {
    const b = doc.data();

    if (!data[b.date]) data[b.date] = [];

    data[b.date].push({
      start: b.start,
      end: b.end
    });
  });

  return data;
};

// 🔥 FOGLALÁS
window.book = async function () {

  const selected = window.getSelected();

  if (!selected) {
    alert("Válassz időpontot!");
    return;
  }

  await addDoc(collection(db, "bookings"), {
    date: selected.date,
    start: selected.start,
    end: selected.end,
    time: selected.label,
    created: new Date()
  });

  alert("🔥 Foglalás mentve!");

  location.reload();
};
</script>

</body>
</html>
